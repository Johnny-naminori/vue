<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vue Props and v-for Sample</title>
  <script src="https://unpkg.com/vue@3.5.0/dist/vue.global.js"></script>
  <style>
    .demo {
      font-family: sans-serif;
      border: 1px solid #eee;
      border-radius: 2px;
      padding: 20px 30px;
      margin-top: 1em;
      margin-bottom: 40px;
      user-select: none;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="blog-post-demo" class="demo">
    <blog-post
      v-for="post in posts"
      v-bind:title="post.title"
    ></blog-post>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          posts: [
            { title: 'Vueとの航海' },
            { title: 'Vueとの旅' },
            { title: 'Vue旅行記' }
          ]
        }
      }
    })

    app.component('blog-post', {
      props: ['title'],
      template: `<h4>{{ title }}</h4>`
    })

    app.mount('#blog-post-demo')
  </script>
</body>
</html>
