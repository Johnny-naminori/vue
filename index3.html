<!DOCTYPE html>
<html>
<head>
    <title>Vue.js のサンプル</title>
    <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
</head>
<body>
    <h1>Vue3</h1>
    <div id="app">
        <p>{{ message }}</p>
        <p>{{ count }}</p>
        <p>{{ user.lastName }}</p>
        <p>{{ colors[1] }}</p>
    </div>

    <script>
        const appdata = {
            data() {
                return {
                    message: 'Hello Vue',                 // 文字列
                    count: 77,                            // 数値
                    user: {                               // オブジェクト（まとまったデータ）
                        lastName: 'Osonoi',
                        firsName: 'yasushi',
                        country: 'Japan'
                    },
                    colors: ['Red', 'Green', 'Blue']      // 配列（リスト）
                }
            }
        }
        Vue.createApp(appdata).mount('#app')
    </script>
</body>
</html>
