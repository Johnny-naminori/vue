<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vue Slot Sample</title>
  <script src="https://unpkg.com/vue@3.5.0/dist/vue.global.js"></script>
  <style>
    .demo {
      font-family: sans-serif;
      border: 1px solid #eee;
      border-radius: 2px;
      padding: 20px 30px;
      margin-top: 1em;
      margin-bottom: 40px;
      user-select: none;
      overflow-x: auto;
    }

    .alert-box {
      color: #664d03;
      background-color: #fff3cd;
      border: 1px solid #ffecb5;
      border-radius: 4px;
      padding: 15px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="slot-demo" class="demo">
    <alert-box>
      エラーが発生しました。入力内容を確認してください。
    </alert-box>

    <alert-box>
      保存が完了しました。
    </alert-box>
  </div>

  <script>
    const app = Vue.createApp({})

    app.component('alert-box', {
      template: `
        <div class="alert-box">
          <strong>お知らせ：</strong>
          <slot></slot>
        </div>
      `
    })

    app.mount('#slot-demo')
  </script>
</body>
</html>
