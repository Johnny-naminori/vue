<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vue Emit Sample</title>
  <script src="https://unpkg.com/vue@3.5.0/dist/vue.global.js"></script>
  <style>
    .demo {
      font-family: sans-serif;
      border: 1px solid #eee;
      border-radius: 2px;
      padding: 20px 30px;
      margin-top: 1em;
      margin-bottom: 40px;
      user-select: none;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="blog-posts-events-demo" class="demo">
    <div :style="{ fontSize: postFontSize + 'em' }">
      <blog-post
        v-for="post in posts"
        v-bind:title="post.title"
        v-on:enlarge-text="postFontSize += 0.1"
      ></blog-post>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          posts: [
            { title: 'Vueとの航海' },
            { title: 'Vueとの旅' },
            { title: 'Vue旅行記' }
          ],
          postFontSize: 1
        }
      }
    })

    app.component('blog-post', {
      props: ['title'],
      template: `
        <div>
          <h4>{{ title }}</h4>
          <button v-on:click="$emit('enlarge-text')">
            文字を大きくする
          </button>
        </div>
      `
    })

    app.mount('#blog-posts-events-demo')
  </script>
</body>
</html>
