<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vue.js v-bind sample</title>
  <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>

  <style>
    .red {
      font-size: 24px;
      color: red;
    }
  </style>
</head>
<body>
  <h1>Vue3</h1>

  <div id="app">
    <p v-bind:class="{ red: isRed }">
      {{ message }}
    </p>
  </div>

  <script>
    const appdata = {
      data() {
        return {
          message: 'This is sample page.',
          isRed: true
        }
      }
    }

    Vue.createApp(appdata).mount('#app')
  </script>
</body>
</html>
