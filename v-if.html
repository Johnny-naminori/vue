<!DOCTYPE html>
<html>
<head>
    <title>Vue.js のサンプル (v-if)</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
    
    <style>
        .red { font-size: 32pt; font-weight: plain; color: red; }
        .blue { font-size: 24pt; font-weight: bold; color: blue; }
    </style>
</head>
<body>
    <h1 class="bg-primary text-white display-4 px-3">Vue3</h1>
    <div id="app" class="bg-secondary text-white display-4 px-3 container">
        
        <p v-if="isBlue" class="blue">
            {{ message }}
        </p>
        
        <p v-else class="red">
            ※少々お待ちください.....
        </p>
        
    </div>

    <script>
        const appdata = {
            data() {
                return {
                    message: null,
                    isBlue: false // 初期値はfalse（最初は赤文字からスタート）
                }
            },
            mounted() {
                this.message = 'This is sample page.'
                
                // 1秒ごとに true と false をパタパタと反転させるタイマーです
                setInterval(() => {
                    this.isBlue = !this.isBlue // 「!」をつけると真逆の値（反転）になります
                }, 1000)
            }
        }
        Vue.createApp(appdata).mount('#app')
    </script>
</body>
</html>
