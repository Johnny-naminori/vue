<!DOCTYPE html>
<html>
<head>
    <title>Vue.jsのサンプル</title>
    <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
</head>
<body>
    <h1>Vue3</h1>
    
    <div id="app">
        {{ message }}
    </div>

    <script>
        const appdata = {
            data() {
                return {
                    message: "Hello Vue"
                }
            }
        }
        // id="app" の要素にVueのデータをマウント（連動）させます
        Vue.createApp(appdata).mount('#app')
    </script>
</body>
</html>
