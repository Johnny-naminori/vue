<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vue.js v-if2 sample</title>
  <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>

  <style>
    .red {
      font-size: 24px;
      color: red;
      font-weight: bold;
    }

    .blue {
      font-size: 24px;
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Vue3</h1>

  <div id="app">
    <p>count: {{ count }}</p>

    <p v-if="count === 0" class="blue">
      カウントスタート
    </p>

    <p v-else class="red">
      {{ count }} 秒経過
    </p>
  </div>

  <script>
    const appdata = {
      data() {
        return {
          count: 0
        }
      },
      mounted() {
        setInterval(() => {
          this.count++

          if (this.count >= 10) {
            this.count = 0
          }
        }, 1000)
      }
    }

    Vue.createApp(appdata).mount('#app')
  </script>
</body>
</html>
