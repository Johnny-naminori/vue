<!DOCTYPE html>
<html>
<head>
    <title>Vue.js のサンプル (mounted)</title>
    <script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
</head>
<body>
    <h1>Vue3</h1>
    <div id="app">
        <p>{{ message }}</p>
    </div>

    <script>
        const appdata = {
            data() {
                return {
                    message: 'Hello Vue!',
                    count: 0
                }
            },
            // 画面がパッと表示された瞬間に、以下のタイマー処理が自動起動します
            mounted() {
                setInterval(() => {
                    this.count++ // カウントを1ずつ増やします
                    this.message = 'Count: ' + this.count // 画面の文字を上書きします
                }, 1000) // 1000ミリ秒（＝1秒）ごとにずっと繰り返す、という指示です
            }
        }
        Vue.createApp(appdata).mount('#app')
    </script>
</body>
</html>
